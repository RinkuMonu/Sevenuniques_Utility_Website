name: Deploy Next.js SSR App via PM2 (ZIP Deploy)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: 📥 Checkout Code
        uses: actions/checkout@v3

      # 2️⃣ Create ZIP file (SAFE)
      - name: 📦 Create ZIP archive
        run: |
          zip -r project.zip . \
            -x "node_modules/*" \
            -x ".git/*" \
            -x ".next/cache/*"

      # 3️⃣ Upload ZIP to server
      - name: 📤 Upload ZIP to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "project.zip"
          target: "/home/finuniqu/public_html/Sevenuniques_Utility_Website"

      # 4️⃣ Extract ZIP on server
      - name: 📂 Extract ZIP on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/finuniqu/public_html/Sevenuniques_Utility_Website
            unzip -o project.zip
            rm -f project.zip

      # 5️⃣ Install & Build on server
      - name: 🔨 Install & Build Project
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/finuniqu/public_html/Sevenuniques_Utility_Website
            npm install --legacy-peer-deps
            npm run build

      # 6️⃣ PM2 Restart
      - name: 🔄 Restart PM2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/finuniqu/public_html/Sevenuniques_Utility_Website
            pm2 delete finuniques.in || true
            pm2 start ecosystem.config.js
            pm2 save
