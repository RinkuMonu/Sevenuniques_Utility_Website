           
name: Deploy Next.js SSR App via PM2 (Optimized)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Get latest code
      - name: 📥 Checkout Code
        uses: actions/checkout@v3

      # 2️⃣ Setup Node environment
      - name: 🛠 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3️⃣ Create tar.gz (Safe, no file changed errors)
      - name: 📦 Create deployment tarball
        run: |
          tar --warning=no-file-changed --ignore-failed-read -czf project.tar.gz \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.next/cache \
            .

      # 4️⃣ Clean old project folder on server
      - name: 🧹 Clean old deployment folder
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            rm -rf /home/finuniqu/public_html/Sevenuniques_Utility_Website/*
            mkdir -p /home/finuniqu/public_html/Sevenuniques_Utility_Website

      # 5️⃣ Upload ONLY the tar.gz (no folder upload → no tar corruption)
      - name: 📤 Upload project.tar.gz (SAFE UPLOAD)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "project.tar.gz"
          target: "/home/finuniqu/public_html/Sevenuniques_Utility_Website"

      # 6️⃣ Extract tar.gz on server
      - name: 📂 Extract project on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/finuniqu/public_html/Sevenuniques_Utility_Website
            tar -xzf project.tar.gz
            rm -f project.tar.gz

      # 7️⃣ Install dependencies + Build Next.js project
      - name: 🔨 Install & Build Project
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/finuniqu/public_html/Sevenuniques_Utility_Website
            npm install --legacy-peer-deps
            npm run build

      # 8️⃣ PM2 Zero-Downtime Restart
      - name: 🔄 Restart PM2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/finuniqu/public_html/Sevenuniques_Utility_Website

            pm2 delete finunique || true
            pm2 start ecosystem.config.js --name finunique
            pm2 save
