name: Deploy Next.js SSR App via PM2 (Final Stable)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout latest code
      - name: 📥 Checkout Code
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js
      - name: 🛠 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 3️⃣ Move into the actual project folder (IMPORTANT)
      - name: 📌 Move into Project Directory
        run: |
          cd $GITHUB_WORKSPACE/Sevenuniques_Utility_Website
          pwd
          echo "Inside Project Folder"
          ls -la

      # 4️⃣ Create tar.gz INSIDE project folder but save OUTSIDE (correct path)
      - name: 📦 Create deployment tarball
        run: |
          cd $GITHUB_WORKSPACE/Sevenuniques_Utility_Website
          tar --warning=no-file-changed --ignore-failed-read -czf ../project.tar.gz \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.next/cache \
            .

      # 5️⃣ Debug to verify tar.gz exists
      - name: 🔍 Verify tar.gz exists
        run: |
          cd $GITHUB_WORKSPACE
          echo "FILES IN WORKSPACE:"
          ls -la

      # 6️⃣ Upload project.tar.gz only
      - name: 📤 Upload tar.gz to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "project.tar.gz"
          target: "/home/finuniqu/public_html/Sevenuniques_Utility_Website"

      # 7️⃣ Extract + Install + Build + PM2 restart
      - name: 🔄 Deploy on Server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/finuniqu/public_html/Sevenuniques_Utility_Website

            # Clean old code
            rm -rf *

            # Extract new tar.gz
            tar -xzf project.tar.gz
            rm -f project.tar.gz

            # Install dependencies
            npm install --legacy-peer-deps

            # Build Next.js
            npm run build

            # Restart PM2
            pm2 delete finunique || true
            pm2 start ecosystem.config.js --name finunique
            pm2 save
