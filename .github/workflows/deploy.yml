name: Deploy Next.js SSR App via PM2 (Safe Version)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: 📥 Checkout Code
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js
      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 3️⃣ Create tar.gz instead of uploading full folder
      - name: 📦 Create project.tar.gz
        run: |
          tar --warning=no-file-changed --ignore-failed-read -czf project.tar.gz \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.next/cache \
            .

      # 4️⃣ Upload project.tar.gz to server
      - name: 📤 Upload tar.gz
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "project.tar.gz"
          target: "/home/finuniqu/public_html/Sevenuniques_Utility_Website"

      # 5️⃣ Extract → Install → Build → PM2 restart (all same like your old one)
      - name: 🔄 Build & Restart App via PM2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/finuniqu/public_html/Sevenuniques_Utility_Website

            # Clean old app
            rm -rf *

            # Extract uploaded project
            tar -xzf project.tar.gz
            rm -f project.tar.gz

            # Install + Build
            npm install --legacy-peer-deps
            npm run build

            # PM2 Restart (same as your old workflow)
            pm2 delete finuniques.in || true
            pm2 start ecosystem.config.js --name finuniques.in
            pm2 save
