name: Deploy Next.js SSR App via PM2 (Optimized)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v3

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🧹 Clean old deployment (mirror deploy)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            rm -rf /home/finuniqu/public_html/Sevenuniques_Utility_Website/*
            mkdir -p /home/finuniqu/public_html/Sevenuniques_Utility_Website

      - name: 📤 Upload new project files
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "."
          target: "/home/finuniqu/public_html/Sevenuniques_Utility_Website"

      - name: 🔨 Install dependencies & Build Project
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/finuniqu/public_html/Sevenuniques_Utility_Website
            npm install --legacy-peer-deps
            npm run build

      - name: 🔄 PM2 Zero-Downtime Restart
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/finuniqu/public_html/Sevenuniques_Utility_Website

            # Delete old process if exists
            pm2 delete finunique || true

            # Start new version
            pm2 start ecosystem.config.js

            # Save PM2 state
            pm2 save
